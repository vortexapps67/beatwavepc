name: Build Test Windows

on:
  push:
    branches:
      - main
      - beatwave-pc
      - '**'
  pull_request:
    branches:
      - main
      - beatwave-pc
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (without leading v)"
        required: false
        default: "3.0.0-test"
      run_tests:
        description: "Run desktop tests before packaging"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build EXE, MSI and portable
    runs-on: windows-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up WiX Toolset 3
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath "$env:RUNNER_TEMP\wix"
          "$env:RUNNER_TEMP\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show native build tools
        shell: pwsh
        run: |
          java -version
          cmake --version
          ninja --version
          g++ --version
          candle.exe -?
        continue-on-error: true

      - name: Write local.properties
        shell: bash
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: Run desktop tests
        if: ${{ inputs.run_tests }}
        shell: pwsh
        run: .\gradlew.bat :shared:jvmTest :desktopApp:test "-Pbeatwave.version=${{ inputs.version }}"

      - name: Build Windows packages
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          if (-not $v) { $v = "3.0.0" }
          .\gradlew.bat `
            :desktopApp:packageMsi `
            :desktopApp:createDistributable `
            "-Pbeatwave.version=$v"

      - name: Collect artifacts
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          if (-not $v) { $v = "3.0.0" }
          New-Item -ItemType Directory -Force dist | Out-Null

          $msi = Get-ChildItem "desktopApp/build/compose/binaries/main/msi/*.msi" | Select-Object -First 1
          if (-not $msi) { throw "No MSI package found" }
          Copy-Item $msi.FullName "dist/BeatWave-PC-$v-windows-x64.msi"

          $appDir = "desktopApp/build/compose/binaries/main/app/BeatWave PC"
          if (Test-Path $appDir) {
            Remove-Item "$appDir\runtime\legal" -Recurse -Force -ErrorAction SilentlyContinue
            Get-ChildItem -Path $appDir -Recurse -Filter *.pdb -ErrorAction SilentlyContinue | Remove-Item -Force
            $unneededExes = @("keytool.exe", "kinit.exe", "klist.exe", "ktab.exe", "rmiregistry.exe", "jpackage.exe")
            foreach ($u in $unneededExes) {
              Remove-Item "$appDir\runtime\bin\$u" -Force -ErrorAction SilentlyContinue
            }
          }

          7z a -tzip -mx=9 "dist/BeatWave-PC-$v-windows-x64-portable.zip" "$appDir/*" | Out-Null

          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: BeatWave-PC-MSI-${{ inputs.version || '3.0.0' }}
          path: dist/*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BeatWave-PC-Windows-Portable-${{ inputs.version || '3.0.0' }}
          path: dist/*-portable.zip
          if-no-files-found: error
          retention-days: 14
