name: Build Windows PC App (MSI & Portable)

on:
  push:
    branches:
      - main
      - beatwave-pc
      - '**'
  pull_request:
    branches:
      - main
      - beatwave-pc
  workflow_dispatch:
    inputs:
      version:
        description: "Package version"
        required: false
        default: "3.0.0"
      run_tests:
        description: "Run tests before packaging"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows EXE & Portable
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up WiX Toolset 3
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath "$env:RUNNER_TEMP\wix"
          "$env:RUNNER_TEMP\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify build environment
        shell: pwsh
        run: |
          java -version
          cmake --version
          ninja --version
          g++ --version
        continue-on-error: true

      - name: Write local.properties
        shell: bash
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: Build Windows EXE, MSI and Portable Packages
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          if (-not $v) { $v = "3.0.0" }
          Write-Host "Building BeatWave PC version $v"
          .\gradlew.bat `
            :desktopApp:packageMsi `
            :desktopApp:createDistributable `
            "-Pbeatwave.version=$v" `
            "-Pbitchord.version=$v" `
            --stacktrace

      - name: Stage Distributables
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          if (-not $v) { $v = "3.0.0" }
          New-Item -ItemType Directory -Force dist | Out-Null

          $msi = Get-ChildItem "desktopApp/build/compose/binaries/main/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName "dist/BeatWave-PC-$v.msi"
            Write-Host "Found MSI: $($msi.FullName)"
          } else {
            throw "No MSI package found in desktopApp/build/compose/binaries/main/msi/"
          }

          # Portable packaging (Self-contained with optimized runtime)
          $appDir = Get-ChildItem "desktopApp/build/compose/binaries/main/app" -Directory | Select-Object -First 1
          if ($appDir) {
            Write-Host "Optimizing runtime and trimming bloat from $($appDir.FullName)..."
            Remove-Item "$($appDir.FullName)\runtime\legal" -Recurse -Force -ErrorAction SilentlyContinue
            Get-ChildItem -Path $appDir.FullName -Recurse -Filter *.pdb -ErrorAction SilentlyContinue | Remove-Item -Force
            $unneededExes = @("keytool.exe", "kinit.exe", "klist.exe", "ktab.exe", "rmiregistry.exe", "jpackage.exe")
            foreach ($u in $unneededExes) {
              Remove-Item "$($appDir.FullName)\runtime\bin\$u" -Force -ErrorAction SilentlyContinue
            }

            Write-Host "Creating ultra-compressed portable zip from $($appDir.FullName)"
            7z a -tzip -mx=9 "dist/BeatWave-PC-$v-portable.zip" "$($appDir.FullName)/*" | Out-Null
          } else {
            throw "No app directory found in desktopApp/build/compose/binaries/main/app/"
          }

          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload BeatWave PC Installer (MSI)
        uses: actions/upload-artifact@v4
        with:
          name: BeatWave-PC-Windows-MSI
          path: dist/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Upload BeatWave PC Portable (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: BeatWave-PC-Windows-Portable-ZIP
          path: dist/*-portable.zip
          if-no-files-found: error
          retention-days: 30
