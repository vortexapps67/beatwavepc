name: Build and Sign Android APK

on:
  push:
    branches:
      - main
      - beatwave-pc
      - '**'
  pull_request:
    branches:
      - main
      - beatwave-pc
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-sign-apk:
    name: Build & Sign APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure local.properties
        shell: bash
        run: |
          {
            echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}"
            echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}"
          } > local.properties

      - name: Setup Keystore & Signing Properties
        shell: bash
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using repository secret KEYSTORE_BASE64"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > beatwave-release.jks
            {
              echo "storeFile=beatwave-release.jks"
              echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
              echo "keyAlias=${{ secrets.KEY_ALIAS }}"
              echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            } > keystore.properties
          else
            echo "No KEYSTORE_BASE64 secret provided; generating CI signing keystore"
            keytool -genkey -v -keystore beatwave-release.jks -alias beatwave \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass beatwave123 -keypass beatwave123 \
              -dname "CN=BeatWave, OU=VortexApps, O=VortexApps, L=Unknown, ST=Unknown, C=US"
            {
              echo "storeFile=beatwave-release.jks"
              echo "storePassword=beatwave123"
              echo "keyAlias=beatwave"
              echo "keyPassword=beatwave123"
            } > keystore.properties
          fi

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build Signed Prod Release APK
        run: ./gradlew :app:assembleProdRelease --stacktrace

      - name: List & Verify Generated APKs
        shell: bash
        run: |
          echo "Generated APK files:"
          find app/build/outputs/apk/prod/release -maxdepth 1 -type f -name "*.apk" -print
          echo
          echo "SHA-256 Checksums:"
          find app/build/outputs/apk/prod/release -maxdepth 1 -type f -name "*.apk" -print0 | xargs -0 sha256sum

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeatWave-Release-APK
          path: app/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error
          retention-days: 30
